services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: presupuestador
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d presupuestador"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5438:5432"

  php-fpm:
    build: docker/php
    working_dir: /application
    volumes:
      - .:/application
    environment:
      DATABASE_URL: postgresql://app:app@database:5432/presupuestador?serverVersion=16&charset=utf8
    depends_on:
      database:
        condition: service_healthy

  webserver:
    image: nginx:1.27-alpine
    working_dir: /application
    volumes:
      - .:/application:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:80"
    depends_on:
      - php-fpm

volumes:
  database_data:
